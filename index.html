<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MT5 Charts</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="topbar">
    <button id="symbolBtn" class="hb hb-symbol" title="Symbol search">
      <svg viewBox="0 0 18 18" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M7.5 13a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Zm4-1.5L16 16"/></svg>
      <span id="symbolName"></span>
    </button>
    <button id="favToggle" class="hb hb-icon" title="Add to favorites"></button>
    <div class="sep"></div>
    <div id="tfBar"></div>
    <button id="tfMore" class="hb hb-icon" title="All MT5 timeframes"><svg viewBox="0 0 18 18" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="m5 7 4 4 4-4"/></svg></button>
    <div class="sep"></div>
    <button id="chartTypeBtn" class="hb" title="Chart type"></button>
    <div class="sep"></div>
    <button id="indBtn" class="hb" title="Indicators">
      <svg viewBox="0 0 28 28" width="22" height="22"><path fill="currentColor" d="M10.5 19.5c-.8 0-1.3-.2-1.6-.5l.6-1c.2.2.5.3.8.3.4 0 .7-.3.8-.9l1-5.4h-1.4l.2-1.1h1.4l.2-.9c.2-1.4 1-2.2 2.3-2.2.7 0 1.2.2 1.5.4l-.5 1c-.2-.1-.5-.2-.8-.2-.5 0-.8.3-.9 1l-.2.9h1.8l-.2 1.1h-1.8l-1 5.5c-.3 1.4-1 2-2.2 2Zm5.3-2.6 1.7-2.5-1.1-2.6h1.3l.6 1.6 1-1.6h1.4l-1.7 2.5 1.1 2.6h-1.3l-.6-1.6-1.1 1.6h-1.3Z"/></svg>
      Indicators
    </button>
    <button id="layoutBtn" class="hb hb-icon" title="Chart layout"></button>
    <div class="grow"></div>
    <span id="conn" class="conn off"></span>
    <button id="settingsBtn" class="hb hb-icon" title="Settings">
      <svg viewBox="0 0 28 28" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M14 17.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.8-3.5c0-.5 0-1-.1-1.4l2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.4-1.4L16.5 5h-5l-.4 2.6c-.9.3-1.7.8-2.4 1.4l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 2.8l-2 1.6 2 3.4 2.4-.9c.7.6 1.5 1.1 2.4 1.4l.4 2.6h5l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.4.9 2-3.4-2-1.6c.1-.4.1-.9.1-1.4Z"/></svg>
    </button>
  </header>
  <div id="main">
    <nav id="drawbar"></nav>
    <section id="center">
      <div id="grid"></div>
      <div id="bottom">
        <div class="tabs" id="bottomTabs">
          <button data-tab="pine">Pine Editor</button>
          <button data-tab="journal">Journal</button>
          <div class="grow"></div>
          <button id="bottomToggle" class="hb-icon" title="Maximize / minimize panel"><svg viewBox="0 0 18 18" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="m5 11 4-4 4 4"/></svg></button>
        </div>
        <div class="pane" data-pane="pine">
          <div class="row">
            <select id="pineList"></select>
            <button id="pineNew" class="btn">New</button>
            <button id="pineSave" class="btn">Save</button>
            <label class="btn">Open .pine file<input id="pineFile" type="file" accept=".pine,.txt" hidden></label>
            <button id="pineDel" class="btn">Delete</button>
            <div class="grow"></div>
            <button id="pineAdd" class="btn primary">Add to chart</button>
          </div>
          <div class="editor"><pre id="pineGutter" aria-hidden="true"></pre><textarea id="pineCode" spellcheck="false" wrap="off"></textarea></div>
          <div id="pineMsg"></div>
        </div>
        <div class="pane" data-pane="journal"><pre id="journal"></pre></div>
      </div>
    </section>
    <aside id="side">
      <div class="tabs" id="sideTabs">
        <button data-tab="fav">Favorites</button>
        <button data-tab="watch">Market Watch</button>
        <button data-tab="ea">Experts</button>
      </div>
      <div id="sideBody"></div>
    </aside>
  </div>
  <div id="menu" class="menu hidden"></div>
  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
